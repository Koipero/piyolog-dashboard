<style>*{box-sizing:border-box}html,body{margin:0;color:#29272a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,Arial,sans-serif;background:#faf9f7}button,input{font:inherit}button{color:inherit;cursor:pointer;background:white;border:1px solid #d9d5d4;border-radius:9px;padding:6px 10px}button:focus-visible{outline:3px solid #783b63}h1,h2,p{margin:0}#app{height:100vh;padding:1.3vh 1.2vw;display:flex;flex-direction:column;max-width:1600px;margin:auto}header{display:flex;align-items:center;min-height:7vh}#date{background:#eeedeb;border-radius:20px;padding:4px 10px;font-weight:bold}h1{flex:1;text-align:center;font-size:3.6vh}main{flex:1;min-height:0;display:flex;margin:1vh 0}.left{width:20%;padding:0 1vw 0 0;display:flex;flex-direction:column}.journal{width:52%;display:flex;flex-direction:column;min-width:0}.right{width:28%;padding-left:1vw;display:flex;flex-direction:column;justify-content:space-between}.box,.journal{background:#fff;border:1px solid #d7d4d2;border-radius:14px;overflow:hidden}.clock{font-weight:750;font-size:6.3vw;letter-spacing:-.065em;text-align:center;padding:1vh 0;border-block:1px solid #dfdcda}.environment{padding:1.7vh 0;border-bottom:1px solid #dad7d5}.environment small,.hint{display:block;color:#666168;font-size:12px}.sensors{display:flex;justify-content:space-between;margin:.8vh 0}.sensors b{font-size:2.4vw}.environment p{font-size:2vw;font-weight:bold}.left button{margin-top:auto}.head,.box h2{display:flex;align-items:center;padding:1vh .8vw;font-weight:bold;font-size:2.7vh}.head{color:#fff;background:#d95472;justify-content:space-between}.log{overflow:auto;flex:1;padding:0 .8vw}.row{display:flex;align-items:center;border-bottom:1px solid #e6e3e1;padding:.7vh 0;min-height:6.2vh;font-size:2.65vh}.row time{width:19%;text-align:center;font-weight:bold}.row em{font-style:normal;font-weight:bold;color:#ad385c;margin-left:1vw}.icon{display:inline-flex;align-items:center;justify-content:center;width:4.8vh;height:4.8vh;border-radius:50%;margin-right:1vw;flex-shrink:0}svg{width:72%;height:72%}.c0{background:#ffe0dd}.c1{background:#d4eee6}.c2{background:#ffe9b9}.c3{background:#e3efbd}.c4{background:#eedff5}.c5{background:#d8eaf7}.c6{background:#ebdbed}.c7{background:#d9eaf7}.right h2{background:#eeedeb;font-size:2.55vh}.stat{display:flex;align-items:center;border-top:1px solid #eee;padding:.6vh .65vw;font-size:2.4vh}.stat .icon{width:3.7vh;height:3.7vh}.stat strong{margin-left:auto}.care{background:#eee8fc;padding:1.1vh .8vw;border-radius:14px}.care h2{padding:0;background:none}.care strong{display:block;text-align:center;font-size:4vh}.care small,.sleep p{display:block;padding:.8vh .6vw;font-size:2.2vh}.sleep p{font-weight:bold}.deck{display:flex;min-height:12vh}.deck button{flex:1;min-width:0;margin:0 .25vw;border:2px solid transparent;font-weight:bold;font-size:2.5vh;display:flex;align-items:center;justify-content:center;flex-direction:column}.deck svg{height:5vh;width:5vh}.deck .on{border-color:#484047}.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:.6vh}.status button{padding:3px 8px}.error{color:#a32340}.overlay{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:rgba(30,26,30,.35);display:flex;align-items:center;justify-content:center}.overlay[hidden]{display:none}.dialog{background:white;border-radius:14px;padding:18px;width:92%;max-width:470px;max-height:90vh;overflow:auto}.dialog label{display:block;margin:10px 0}.dialog input{width:100%;padding:7px}.dialog p{font-size:13px;margin:8px 0}.dialog button{margin:4px}.log .hint{padding:14px}
@media(orientation:portrait){#app{height:auto;min-height:100vh;padding:10px}header{min-height:40px}h1{font-size:18px}.left,.journal,.right{width:100%;padding:0}main{display:block}.left{display:flex;flex-direction:row;align-items:center;justify-content:space-between}.clock{font-size:42px}.environment{display:none}.left button{margin:0}.journal{margin:10px 0}.log{max-height:43vh}.right{display:flex;flex-direction:row;flex-wrap:wrap}.right>*{flex:1;min-width:130px;margin:2px}.deck{flex-wrap:wrap}.deck button{flex:1 0 22%;margin:2px;font-size:14px}.head,.box h2,.row,.stat{font-size:16px}.status{flex-wrap:wrap}.care strong{font-size:24px}}
</style></head><body><div id="app"><header><b id="date">—</b><h1 id="title">育児ダッシュボード</h1></header><main><aside class="left"><div class="clock" id="clock">--:--</div><div class="environment"><small>室内環境（手入力）</small><div class="sensors"><b id="room">—℃</b><b id="humidity">—%</b></div></div><div class="environment"><small>天気（手入力）</small><p id="weather">—</p></div><button id="all">▤ 育児記録一覧</button></aside><section class="journal"><div class="head"><span id="logtitle">今日の記録</span></div><div id="events" class="log"></div></section><aside class="right"><section class="box"><h2>▥ 今日の合計</h2><div class="stat" title="量はミルク・搾母乳の記録量。回数は母乳も含む。※は量が不明な記録あり"><span class="icon c0"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#fff4cc" d="M10 11h12v16a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z"/><path fill="#efc17e" d="M11 8l2-2V4a3 3 0 0 1 6 0v2l2 2v3H11z"/><path d="M18 16h3m-3 5h3"/></svg></span>授乳<strong id="total">—</strong></div><div class="stat"><span class="icon c1"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#99e6cd" d="M3 7h26l-1 11-7 9H11l-7-9z"/><path d="M4 11h24M5 17q8 0 8 10m14-10q-8 0-8 10"/><path d="M9 9v4m14-4v4"/></svg></span>おしっこ<strong id="pee">—</strong></div><div class="stat"><span class="icon c2"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#f68fa3" d="M7 18q-2-6 6-8 3-1 2-6 9 4 6 10 6-1 6 5 5 2 3 6-1 4-14 4S2 27 2 23q0-4 5-5z"/></svg></span>うんち<strong id="poop">—</strong></div><div class="stat"><span class="icon c3"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#f1a0ae" d="M2 15h28q-2 13-14 13T2 15z"/><ellipse fill="#fff7c6" cx="16" cy="15" rx="14" ry="4"/><path d="M18 15L28 4" stroke-width="4"/></svg></span>離乳食<strong id="solid">—</strong></div></section><section class="care"><h2>⌛ 次のケア（目安）</h2><strong>授乳 <span id="next">--:--</span></strong><small id="last">—</small></section><section class="box sleep"><h2>☾ 睡眠</h2><p id="sleep">—</p></section></aside></main><nav class="deck" aria-label="今日の記録を絞り込み"><button id="cat0" class="c0" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#fff4cc" d="M10 11h12v16a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z"/><path fill="#efc17e" d="M11 8l2-2V4a3 3 0 0 1 6 0v2l2 2v3H11z"/><path d="M18 16h3m-3 5h3"/></svg>授乳</button><button id="cat1" class="c1" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#99e6cd" d="M3 7h26l-1 11-7 9H11l-7-9z"/><path d="M4 11h24M5 17q8 0 8 10m14-10q-8 0-8 10"/><path d="M9 9v4m14-4v4"/></svg>おしっこ</button><button id="cat2" class="c2" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#f68fa3" d="M7 18q-2-6 6-8 3-1 2-6 9 4 6 10 6-1 6 5 5 2 3 6-1 4-14 4S2 27 2 23q0-4 5-5z"/></svg>うんち</button><button id="cat3" class="c3" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#f1a0ae" d="M2 15h28q-2 13-14 13T2 15z"/><ellipse fill="#fff7c6" cx="16" cy="15" rx="14" ry="4"/><path d="M18 15L28 4" stroke-width="4"/></svg>離乳食</button><button id="cat4" class="c4" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#fff" d="M12 19V6a4 4 0 0 1 8 0v13a7 7 0 1 1-8 0z"/><path stroke="#ef779e" stroke-width="4" d="M16 10v12"/><circle fill="#ef779e" stroke="none" cx="16" cy="24" r="3"/></svg>体温</button><button id="cat5" class="c5" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#fff" d="M5 17L17 5a7 7 0 0 1 10 10L15 27A7 7 0 0 1 5 17z"/><path fill="#88c6db" d="m11 11 10 10-6 6A7 7 0 0 1 5 17z"/></svg>服薬</button><button id="cat6" class="c6" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#a9d2e9" d="M2 15h28l-3 9q-1 3-5 3H10q-5 0-6-4z"/><path d="M6 27v2m19-2v2"/><path fill="#fff" d="M7 15a4 4 0 0 1 4-7 5 5 0 0 1 9-2 5 5 0 0 1 5 9z"/></svg>入浴</button><button id="cat7" class="c7" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#323033" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path fill="#b8dcf4" d="M3 16h26v9H3z"/><path d="M3 11v18m26-12v12"/><rect fill="#fff" x="5" y="12" width="7" height="4" rx="2"/><path d="M16 8h4l-4 4h4m3-9h5l-5 5h5"/></svg>睡眠</button></nav><div class="status"><span><b id="connection-state"></b>　最終取得 <span id="updated">—</span></span><span id="message" role="status"></span><button id="settings">設定</button></div></div><div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-label="表示と接続の設定"><h2 id="configtitle">設定</h2><label>公式フィードURL<input type="password" id="feed" autocomplete="off" spellcheck="false"></label><p>表示するお子さん1人分のURLを入力してください。設定はこのページを開いている間だけ保持します。</p><button id="connect">取得して表示</button><button id="sample">サンプルに戻す</button><div id="settingsError" role="status"></div><label>室温（℃）<input id="degrees" type="number" step="0.1"></label><label>湿度（%）<input id="rh" type="number" min="0" max="100"></label><label>天気・地域（手入力）<input id="forecast" maxlength="22"></label><button id="apply">表示設定を反映</button><button id="close">閉じる</button></section></div><noscript>JavaScriptを有効にしてブラウザで開いてください。</noscript><script>
(function(){
'use strict';
var BASE=9*3600000, lastRows=[], day='', url='', active=null, lastSuccess=null;
function byId(id){return document.getElementById(id);}
function pad(n){return n<10?'0'+n:''+n;}
function tokyoDate(v){return new Date(new Date(v).getTime()+BASE);}
function jday(v){var d=tokyoDate(v);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function jtime(v){var d=tokyoDate(v);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());}
function jshort(v){var d=tokyoDate(v);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function today(){return jday(new Date());}
function txt(id,v){byId(id).textContent=v;}
function state(s,err){txt('message',s);byId('message').className=err?'error':'';}
function valid(r){return r && typeof r.type==='string' && typeof r.datetime==='string' && !isNaN(new Date(r.datetime).getTime());}
function sortRows(rs){var result=[];var i;for(i=0;i<rs.length;i++){if(valid(rs[i]))result.push(rs[i]);}result.sort(function(a,b){return Date.parse(b.datetime)-Date.parse(a.datetime);});return result;}
function amount(r){if(r.value && r.value.value!=null && typeof r.value.value==='number'){var n=r.value.value;return isFinite(n)?n:null;}return null;}
function name(r){var names={Formula:'ミルク',Pee:'おしっこ',Poop:'うんち',BreastFeeding:'母乳',ExpressedBreastMilk:'搾母乳',Sleep:'寝る',WakeUp:'起きる',Temperature:'体温',Bath:'お風呂',Medicine:'くすり',Solid:'離乳食',Memo:'メモ'};return names[r.type]||r.type;}
function recordLabel(r){var s=name(r), n=amount(r);if(n!==null && r.value && r.value.unit)s+=' '+n+(r.value.unit==='celsius'?'℃':r.value.unit);return s;}
var groups=['授乳','おしっこ','うんち','離乳食','体温','服薬','入浴','睡眠'];
var filter=-1,historyMode=false;
function group(r){
  var map={Formula:0,BreastFeeding:0,ExpressedBreastMilk:0,Pee:1,Poop:2,Solid:3,Temperature:4,Medicine:5,Bath:6,Sleep:7,WakeUp:7};
  return Object.prototype.hasOwnProperty.call(map,r.type)?map[r.type]:-1;
}
function node(tag,value){var el=document.createElement(tag);el.textContent=value;return el;}
function drawList(){
  var log=byId('events'),fragment=document.createDocumentFragment(),count=0;
  txt('logtitle',historyMode?'取得期間の記録':filter<0?'今日の記録':'今日の'+groups[filter]);
  for(var i=0;i<lastRows.length;i++){
    var r=lastRows[i],g=group(r);
    if(!historyMode && jday(r.datetime)!==day || filter>=0 && g!==filter)continue;
    var row=node('div','');row.className='row';
    row.appendChild(node('time',(historyMode && jday(r.datetime)!==day?jshort(r.datetime)+' ':'')+jtime(r.datetime)));
    var icon=node('span',g<0?'・':'');icon.className='icon c'+g;
    if(g>=0)icon.appendChild(byId('cat'+g).firstChild.cloneNode(true));
    row.appendChild(icon);row.appendChild(node('b',name(r)));
    if(amount(r)!==null && r.value.unit)row.appendChild(node('em',amount(r)+(r.value.unit==='celsius'?'℃':r.value.unit)));
    fragment.appendChild(row);count++;
  }
  log.textContent='';if(count)log.appendChild(fragment);else log.appendChild(node('p',url && !lastSuccess?'未取得':'該当する記録はありません'));
  for(var k=0;k<8;k++){byId('cat'+k).className='c'+k+(filter===k?' on':'');byId('cat'+k).setAttribute('aria-pressed',String(filter===k));}
}
function render(rows){
  lastRows=rows;day=today();
  var feeds=[],counts=[0,0,0,0],sum=0,unknown=0,sleep=null;
  for(var i=0;i<rows.length;i++){
    var r=rows[i],g=group(r);
    if(g===0)feeds.push(r);
    if(g===7 && !sleep)sleep=r;
    if(jday(r.datetime)!==day || g<0 || g>3)continue;
    counts[g]++;
    if(r.type==='Formula'||r.type==='ExpressedBreastMilk'){
      if(amount(r)!==null && amount(r)>=0 && r.value.unit==='ml')sum+=amount(r);else unknown++;
    }
  }
  var blank=url && !lastSuccess;
  txt('total',blank?'—':sum+'ml ('+counts[0]+'回)'+(unknown?'※':''));
  txt('pee',blank?'—':counts[1]+'回');txt('poop',blank?'—':counts[2]+'回');txt('solid',blank?'—':counts[3]+'回');
  var elapsed=0,gaps=0;
  for(i=1;i<feeds.length && i<=4;i++){var delta=Date.parse(feeds[i-1].datetime)-Date.parse(feeds[i].datetime);if(delta>0 && delta<43200000){elapsed+=delta;gaps++;}}
  var next=gaps?new Date(Date.parse(feeds[0].datetime)+elapsed/gaps):null;
  txt('next',next?(jday(next)!==day?jshort(next)+' ':'')+jtime(next):'--:--');
  txt('last',feeds.length?'前回 '+jshort(feeds[0].datetime)+' '+jtime(feeds[0].datetime)+'　'+name(feeds[0]):'授乳記録なし');
  txt('sleep',sleep?(sleep.type==='Sleep'?'就寝中　':'起床　')+(jday(sleep.datetime)===day?'':jshort(sleep.datetime)+' ')+jtime(sleep.datetime):'睡眠記録なし');
  drawList();
}
function tick(){
 var now=new Date();txt('date',jshort(now)+'（'+['日','月','火','水','木','金','土'][tokyoDate(now).getUTCDay()]+'）');txt('clock',jtime(now));
 if(day!==today())render(lastRows);
}
function reset(){
  if(active){var previous=active;active=null;previous.abort();}
  url='';lastSuccess=null;byId('feed').value='';
  txt('updated','—');
}
function failure(reason){
  txt('connection-state',lastSuccess?'更新失敗・前回の記録を表示中':'未取得');
  state(reason+'　65秒ごとに再試行します。',true);
}
function request(){
  if(!url || active)return;
  var xhr=new XMLHttpRequest();
  active=xhr;
  txt('connection-state','取得中');
  function finish(){
    if(active!==xhr)return false;
    active=null;
    return true;
  }
  xhr.onload=function(){
    if(!finish())return;
    if(xhr.status!==200){
      failure('HTTP '+xhr.status+'。'+(xhr.status===404?'公式アプリでURLの有効状態を確認してください。':'フィードを取得できませんでした。'));return;
    }
    var data,rows;
    try{data=JSON.parse(xhr.responseText);}catch(e){failure('応答をJSONとして読み取れません。');return;}
    if(!data || !Array.isArray(data.records) || (data.schema_version!=null && data.schema_version!==1)){
      failure('records配列またはデータ形式を確認してください。');return;
    }
    rows=sortRows(data.records);
    if(data.records.length && !rows.length){failure('日時・種類を読み取れる記録がありません。');return;}
    lastSuccess=new Date();
    render(rows);
    txt('updated',jday(lastSuccess)+' '+jtime(lastSuccess));
    txt('connection-state','取得成功');
    state((rows.length<data.records.length?'日時・種類が不明な記録を除外しました。':''),false);
  };
  xhr.onerror=function(){if(finish())failure('通信失敗。Wi-Fi、端末のHTTPS対応、フィード側の外部サイトからの読み取り許可（CORS）を確認してください。');};
  xhr.ontimeout=function(){if(finish())failure('タイムアウト。15秒以内に応答がありませんでした。');};
  try{xhr.open('GET',url,true);xhr.timeout=15000;xhr.send(null);}
  catch(e){if(finish())failure('通信を開始できません。このブラウザのHTTPS通信設定を確認してください。');}
}
function sample(){
  reset();
  var now=Date.now();
  function row(hours,type,ml){
    var r={datetime:new Date(now-hours*3600000).toISOString(),type:type};
    if(ml)r.value={value:ml,unit:'ml'};
    return r;
  }
  var sampleRows=[row(8,'WakeUp'),row(7,'Formula',110),row(6,'Pee'),row(5,'Solid'),row(4,'BreastFeeding'),row(3,'Poop'),row(2,'Pee'),row(1,'Formula',100),row(0.5,'Sleep')];
  render(sortRows(sampleRows));
  txt('connection-state','サンプル（架空の記録）');
  state('',false);
}
function heading(){
  var nickname='';
  if(location.hash.indexOf('#name=')===0){
    try{nickname=decodeURIComponent(location.hash.slice(6)).slice(0,10);}catch(e){}
  }
  txt('title','☺ '+(nickname?nickname+'の':'')+'育児ダッシュボード');
}
function closeDialog(){byId('overlay').hidden=true;byId('settings').focus();}
function init(){
 heading();sample();tick();
 for(var i=0;i<8;i++)(function(k){byId('cat'+k).onclick=function(){filter=filter===k?-1:k;historyMode=false;drawList();byId('events').scrollTop=0;};})(i);
 byId('all').onclick=function(){historyMode=!historyMode;filter=-1;drawList();byId('events').scrollTop=0;};
 byId('settings').onclick=function(){txt('settingsError','');byId('overlay').hidden=false;byId('feed').focus();};
 byId('close').onclick=closeDialog;
 byId('apply').onclick=function(){
  txt('room',(byId('degrees').value||'—')+'℃');txt('humidity',(byId('rh').value||'—')+'%');txt('weather',byId('forecast').value||'—');closeDialog();
 };
  byId('connect').onclick=function(){
    var value=byId('feed').value.replace(/^\s+|\s+$/g,'');
    if(!/^https:\/\/feed\.piyolog\.com\/v1\/feed\/[\w-]+\/[\w.-]+\/[\w.-]+$/.test(value)){
      txt('settingsError','公式アプリのフィードURLを貼り付けてください。');return;
    }
    if(value!==url){
      reset();url=value;render([]);
    }
    byId('feed').value='';closeDialog();request();
  };
  byId('sample').onclick=function(){sample();closeDialog();};
  setInterval(tick,1000);
  setInterval(request,65000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();request();}});
}
try{init();}catch(e){state('画面の初期化に失敗しました。ブラウザでページを再読み込みしてください。',true);}
})();
</script>
</body>
